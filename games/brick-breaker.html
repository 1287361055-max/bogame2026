<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>弹球破砖 · BOGAME 2026</title>
<meta name="description" content="移动挡板反弹光球，击碎整片砖阵。" />
<link rel="icon" type="image/svg+xml" href="../assets/showcase/icon.svg" />
<link rel="stylesheet" href="../assets/css/arcade.css" />
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="btn ghost" href="../index.html">← 返回大厅</a>
    <div class="brand"><span class="dot"></span> 弹球破砖</div>
    <div class="spacer"></div>
    <div class="stat">得分 <b id="score">0</b></div>
    <div class="stat">最高 <b id="best">0</b></div>
    <div class="stat">生命 <b id="lives">3</b></div>
    <button class="btn" id="restart" type="button">重开</button>
    <button class="btn ghost" id="muteBtn" type="button">🔊</button>
  </div>

  <div class="stage">
    <div class="board">
      <canvas id="cv"></canvas>
      <div class="overlay" id="ov">
        <h2></h2>
        <p></p>
        <div class="big"></div>
        <button class="btn primary" id="ovBtn" type="button">开始游戏</button>
      </div>

    </div>

    <aside class="side">
      <h3>玩法说明</h3>
      <p>用挡板反弹光球击碎上方全部砖块，共 3 条命。球落到底线损失一条命。</p>
      <ul>
        <li>每击碎一块砖 +10 分</li>
        <li>挡板边缘反弹角度更斜</li>
        <li>清空砖阵即通关</li>
      </ul>
      <h3 style="margin-top:22px">操作</h3>
      <p>方向键 / 鼠标 / 手指左右移动挡板；点击或按 <kbd>空格</kbd> 发球。</p>
    </aside>
  </div>

  <div class="footer">
    BOGAME 2026 · 星轨游戏盒 &nbsp;|&nbsp; 弹球破砖 &nbsp;|&nbsp; 分数保存在浏览器本地
  </div>

</div>
<script src="../assets/js/arcade.js"></script>
<script src="js/brick-breaker.js"></script>
</body>
</html>
