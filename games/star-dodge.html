<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>星轨闪避 · BOGAME 2026</title>
<meta name="description" content="驾驶飞船穿过陨石雨，坚持 45 秒即可通关。" />
<link rel="icon" type="image/svg+xml" href="../assets/showcase/icon.svg" />
<link rel="stylesheet" href="../assets/css/arcade.css" />
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="btn ghost" href="../index.html">← 返回大厅</a>
    <div class="brand"><span class="dot"></span> 星轨闪避</div>
    <div class="spacer"></div>
    <div class="stat">得分 <b id="score">0</b></div>
    <div class="stat">最高 <b id="best">0</b></div>
    <button class="btn" id="restart" type="button">重开</button>
    <button class="btn ghost" id="muteBtn" type="button">🔊</button>
  </div>

  <div class="stage">
    <div class="board">
      <canvas id="cv"></canvas>
      <div class="meter"><i id="meterFill"></i></div>
      <div class="overlay" id="ov">
        <h2></h2>
        <p></p>
        <div class="big"></div>
        <button class="btn primary" id="ovBtn" type="button">开始游戏</button>
      </div>

    </div>

    <aside class="side">
      <h3>玩法说明</h3>
      <p>飞船在屏幕下方活动，陨石不断从上方落下。躲开全部陨石并坚持 45 秒即可通关。</p>
      <ul>
        <li>每躲过一块陨石 +10 分</li>
        <li>时间越久，陨石越密越快</li>
        <li>被击中立即结束</li>
      </ul>
      <h3 style="margin-top:22px">操作</h3>
      <p>方向键 / <kbd>WASD</kbd> 四向移动，或直接拖动鼠标 / 手指控制飞船。</p>
    </aside>
  </div>

  <div class="footer">
    BOGAME 2026 · 星轨游戏盒 &nbsp;|&nbsp; 星轨闪避 &nbsp;|&nbsp; 分数保存在浏览器本地
  </div>

</div>
<script src="../assets/js/arcade.js"></script>
<script src="js/star-dodge.js"></script>
</body>
</html>
